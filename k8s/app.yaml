# Application PHP (image mon-env-php, v2 après la mise à jour de la question 13) : 2 répliques, mêmes limites que dans Docker
# (2 CPU, 510 Mo, système de fichiers en lecture seule) et 50 Go de stockage persistant.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-stockage
  namespace: production
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Gi                   # stockage alloué à l'application (question 11)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mon-app
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mon-app
  strategy:
    type: RollingUpdate               # mise à jour pod par pod, sans interruption
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: mon-app
    spec:
      containers:
        - name: app
          image: mon-env-php:v2
          imagePullPolicy: IfNotPresent # image chargée dans le cluster par "kind load"
          env:
            - name: DB_HOST
              value: db
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: ecf-db, key: DB_NAME } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: ecf-db, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ecf-db, key: DB_PASSWORD } }
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: "2", memory: 510Mi }
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: apache-run, mountPath: /var/run/apache2 }
            - { name: apache-lock, mountPath: /var/lock/apache2 }
            - { name: stockage, mountPath: /var/www/data }
          # Sonde TCP et non HTTP : chaque affichage de la page incrémente le compteur de visites
          readinessProbe:
            tcpSocket: { port: 80 }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 50Mi }
        - name: apache-run
          emptyDir: { medium: Memory, sizeLimit: 10Mi }
        - name: apache-lock
          emptyDir: { medium: Memory, sizeLimit: 4Mi }
        - name: stockage
          persistentVolumeClaim:
            claimName: app-stockage
---
# Accès depuis l'extérieur du cluster.
# kind : NodePort 30080, publié sur http://localhost:8090 par kind-config.yaml.
# AKS : remplacer "type: NodePort" par "type: LoadBalancer" (IP publique Azure).
apiVersion: v1
kind: Service
metadata:
  name: mon-app
  namespace: production
spec:
  type: NodePort
  selector:
    app: mon-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
